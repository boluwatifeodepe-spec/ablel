name: able_app
description: "Able - Fast, high-quality social media downloader for Android & iOS."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Local Storage & Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Networking & HTTP Downloads
  dio: ^5.4.3+1
  youtube_explode_dart: ^2.0.0
  
  # File Management & Sharing
  path: ^1.9.0
  path_provider: ^2.1.3
  open_filex: ^4.5.0
  share_plus: ^9.0.0
  permission_handler: ^11.3.1
  
  # UI & Design System
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

